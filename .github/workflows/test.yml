name: Test
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional uvu file pattern to run a subset of tests'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  full:
    name: Node.js ${{ matrix.node-version }} Full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 26
          - 23
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run tests
        env:
          FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$FILTER" ]; then
            pnpm exec uvu . "$FILTER"
          else
            pnpm test
          fi
  pack:
    name: Pack npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Clean npm package
        uses: ai/clean-npm-project@29219e611c2da08a07cb0a6a1b965c162e5940a9 # v0.3.0
        with:
          clean-docs: true
          clean-comments: true
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
      - name: Pack npm package
        run: mkdir -p ../dist && npm pack --pack-destination ../dist
        working-directory: cleaned-project/
      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: nanoid-tgz
          path: dist/nanoid-*.tgz
          if-no-files-found: error
